plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.osrstelemetry'
version = '0.2.0'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

test {
    useJUnit()
}

// FIX: this project had no development-launch task at all — that's
// the direct cause of `gradlew run` failing with "Task 'run' not
// found". Not the Gradle `application` plugin (that would default to
// sourceSets.main.runtimeClasspath, which lacks net.runelite:client
// since it's intentionally compileOnly there for the production
// artifact — correct for Plugin Hub submission, wrong for running a
// full client). Uses the test source set's runtime classpath instead,
// since that's where net.runelite:client is actually resolvable
// (testImplementation, already present, untouched here) — same
// classpath the existing `test` task already uses successfully.
// See src/test/java/com/osrstelemetry/plugin/OsrsTelemetryPluginTest.java.
tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Launches a local RuneLite client with this plugin loaded, for manual testing.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('com.osrstelemetry.plugin.OsrsTelemetryPluginTest')
    // Assertions on everywhere, as RuneLite's development launcher requires: ExternalPluginManager.loadBuiltin refuses to
    // start unless its own class has assertions enabled. Off for exactly one class: RuneLite's GPU ModelUploader, whose
    // internal assertion (uploadSortedModel) was the client thread's last log line before the 2026-10-21 dev-client freeze
    // (cause unconfirmed). Release RuneLite runs that class without assertions, as here. Class-specific -da overrides -ea.
    jvmArgs "-ea", "-da:net.runelite.client.plugins.gpu.ModelUploader"
    args "--developer-mode", "--debug"
}

// Route data: regenerates navigation/routes.json from the bundled collision map, transition
// tables, travel catalogue, network entrances and patch markers. A build tool in the test source set (not shipped). Takes a
// few minutes and about 3 GB of heap. Run after changing any of those inputs; RouteTable refuses data generated from other
// transitions, so a stale file fails the tests rather than misguiding.
tasks.register('generateRoutes', JavaExec) {
    group = 'build setup'
    description = 'Regenerates src/main/resources/com/osrstelemetry/plugin/navigation/routes.json.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('com.osrstelemetry.plugin.navigation.RouteTableGenerator')
    maxHeapSize = '4g'
    args file('src/main/resources/com/osrstelemetry/plugin/navigation/routes.json').path
}
